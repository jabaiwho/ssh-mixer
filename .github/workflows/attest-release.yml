name: Build and attest reviewed Receiver release

on:
  workflow_dispatch:
    inputs:
      published_at:
        description: Exact approved UTC timestamp (YYYY-MM-DDTHH:MM:SSZ)
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: receiver-attestation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-attest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the reviewed Receiver release
        id: receiver-release
        run: |
          version="$(PYTHONPATH=src python3 -c 'from ssh_mixer.versions import PINNED_RECEIVER_RELEASE; print(PINNED_RECEIVER_RELEASE)')"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Require protected main and validate the repository
        env:
          PUBLISHED_AT: ${{ inputs.published_at }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          printf '%s' "$PUBLISHED_AT" | grep -Ex '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z' >/dev/null
          test -z "$(git status --porcelain)"
          python3 scripts/check_repository.py
          python3 scripts/check_public_history.py --initial-release

      - name: Build immutable unsigned artifacts and metadata
        env:
          PUBLISHED_AT: ${{ inputs.published_at }}
          RECEIVER_VERSION: ${{ steps.receiver-release.outputs.version }}
        run: |
          mkdir -p dist/artifacts
          python3 scripts/build_release_metadata.py \
            --version "$RECEIVER_VERSION" \
            --commit "$GITHUB_SHA" \
            --published-at "$PUBLISHED_AT" \
            --changes "release/receiver-v${RECEIVER_VERSION}-changes.json" \
            --output "dist/receiver-v${RECEIVER_VERSION}.json" \
            --artifact-dir dist/artifacts
          (cd dist && sha256sum "receiver-v${RECEIVER_VERSION}.json" artifacts/* > SHA256SUMS)

      - name: Attest every built subject
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/receiver-v${{ steps.receiver-release.outputs.version }}.json
            dist/SHA256SUMS
            dist/artifacts/*

      - name: Retain exact unsigned subjects for offline signing review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: receiver-v${{ steps.receiver-release.outputs.version }}-unsigned-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
